<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CUMC YAKAP | Staff Login</title>
  <style>
    :root{--navy:#102b50;--blue:#1c65a8;--bg:#f3f6fb;--muted:#718096}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf1fa,#f7f9fc);color:#17233b;display:grid;place-items:center;padding:20px}
    .login{width:min(420px,100%);background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:34px;box-shadow:0 14px 40px #102b5015}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:48px;height:48px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:bold;font-size:17px}
    h1{font-size:22px;margin:0 0 5px;color:var(--navy)}.sub{color:var(--muted);font-size:13px;margin:0}
    label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d7dfeb;border-radius:9px;font-size:14px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1c65a81a}
    button{width:100%;border:0;border-radius:9px;background:var(--blue);color:#fff;padding:13px;font-weight:700;font-size:14px;margin-top:22px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    .message{display:none;margin-top:15px;padding:11px 12px;border-radius:8px;font-size:13px;line-height:1.45}.error{display:block;background:#fff3f2;color:#a52a20;border:1px solid #f2c4c0}.info{display:block;background:#eef5fc;color:#244f79;border:1px solid #d5e5f5}
    .foot{margin-top:24px;text-align:center;color:#8995a7;font-size:11px;line-height:1.5}
  </style>
</head>
<body>
  <main class="login">
    <div class="brand"><div class="logo">C</div><div><h1>CUMC YAKAP</h1><p class="sub">Staff Dashboard Access</p></div></div>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required placeholder="Enter your username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
      <button id="loginButton" type="submit">Sign in</button>
      <div id="message" class="message" role="alert"></div>
    </form>
    <p class="foot">Authorized personnel only. Patient information must only be accessed through an authenticated backend.</p>
  </main>
<script>
  // Set this to your deployed Apps Script Web App URL.
  const API_URL = "https://script.google.com/macros/s/AKfycbwytHFTKw-o_R7oPlk-iDh1PtyiEzEtSRW5mLYqUgh7LRIeo2fbG0EeavPzWCD-b1LPQA/exec";

  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    message.className = "message";
    message.textContent = "";
    button.disabled = true;
    button.textContent = "Signing in...";

    try {
      // Requires a matching secure doPost(action=login) implementation in Code.gs.
      const body = new URLSearchParams({
        action: "login",
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
      });

      const response = await fetch(API_URL, {
        method: "POST",
        body,
        redirect: "follow"
      });
      const result = await response.json();

      if (!response.ok || !result.success || !result.token) {
        throw new Error(result.message || "Invalid username or password.");
      }

      // Short-lived session token only. Never store the password.
      sessionStorage.setItem("cumcSessionToken", result.token);
      sessionStorage.setItem("cumcSessionExpiry", String(result.expiresAt || ""));
      window.location.href = "home.html";
    } catch (error) {
      message.textContent = error.message || "Unable to sign in. Check the backend connection.";
      message.className = "message error";
    } finally {
      button.disabled = false;
      button.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
